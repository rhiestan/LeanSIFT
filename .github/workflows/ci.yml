name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    # Pushes to branches of this repository already run CI, so pull requests
    # only need it when they come from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 (clang-cl)
            os: windows-2025
            cmake_args: -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          - name: Linux x64 (GCC)
            os: ubuntu-24.04
          - name: Linux ARM64 (GCC)
            os: ubuntu-24.04-arm
          - name: macOS ARM64 (Apple Clang)
            os: macos-15

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # clang-cl needs the MSVC headers and libraries in the environment.
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4
